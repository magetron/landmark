<style>

  <div id="atk"></div>

    <span id="rv">20%</span><input id="ratio" type="range" min="5" max="100" step="5" value="20" aria-label="Attack ratio">

<script>
'use strict';
/* Landmark. Maps are OpenFront's map16x.bin and map4x.bin files (see maps/SOURCE.txt); the attack and
   growth formulas follow OpenFront's EngineConfig, rescaled for the smaller grids. */
const $ = id => document.getElementById(id);

/* ---------- maps ---------- */
// third entry: which of OpenFront's scales to load. Country maps use the half-scale file, four times the tiles.
const MAPS = [['world','World'],['europe','Europe'],['africa','Africa'],['asia','Asia'],['northamerica','North America'],['southamerica','South America'],
  ['china','China','map4x'],['unitedstates','United States','map4x'],['russia','Russia','map4x'],['indiansubcontinent','India','map4x'],['japan','Japan','map4x'],['britannia','Britain','map4x']];
const REF_LAND = 35509, BLK = 10, MIN_ISLE = 50, COLLAPSE = .004, DOMINANT = .7, SCRAP = .02;
const built = [];

const get = u => fetch(u).then(r=>{ if (!r.ok) throw new Error(u+' '+r.status); return r; });
async function loadMap(mi){
  if (built[mi]) return built[mi];
  const id = MAPS[mi][0], key = MAPS[mi][2] || 'map16x';
  const [man, buf] = await Promise.all([
    get('maps/'+id+'/manifest.json').then(r=>r.json()),
    get('maps/'+id+'/'+key+'.bin').then(r=>r.arrayBuffer())]);
  const W = man[key].width, H = man[key].height, N = W*H, tb = new Uint8Array(buf);
  const sc = key==='map4x' ? 2 : 1;            // tiles per side against the quarter-scale maps
  const land = new Uint8Array(N), water = new Uint8Array(N), terr = new Uint8Array(N), base = new Uint32Array(N);
  const rgb = (r,g,b) => (255<<24)|(Math.min(255,b)<<16)|(Math.min(255,g)<<8)|Math.min(255,r);
  // byte per tile: bit 7 land, bit 6 shoreline, bits 0-4 magnitude (elevation, or distance from land)
  for (let c=0;c<N;c++){
    const t=tb[c], isLand=(t&0x80)!==0, shore=(t&0x40)!==0, m=t&31;
    if (isLand && m===31){ base[c]=rgb(60,60,60); continue; }           // impassable
    if (isLand){
      land[c]=1; terr[c]=m<10?0:m<20?1:2;
      if (shore) base[c]=rgb(204,203,158);
      else if (m<10) base[c]=rgb(190,220-2*m,138);
      else if (m<20) base[c]=rgb(200+2*(m-10),183+2*(m-10),138+2*(m-10));
      else { const k=m>>1; base[c]=rgb(230+k,230+k,230+k); }
    } else {
      water[c]=1;
      if (shore) base[c]=rgb(126,170,203);
      else { const d=Math.min(m,10); base[c]=rgb(71-d,133-d,181-d); }
    }
  }
  const M = {mi,id,name:MAPS[mi][1],W,H,N,land,water,terr,base,sc,blk:BLK*sc,ford:2*sc};
  const comp = new Int32Array(N), size=[0], st=[]; let total=0;
  for (let s=0;s<N;s++) if (land[s] && !comp[s]){
    const k=size.length; let n=0; comp[s]=k; st.push(s);
    while (st.length){ const c=st.pop(); n++; for (let j=0;j<4;j++){ const d=nbr(M,c,j); if (d>=0 && land[d] && !comp[d]){ comp[d]=k; st.push(d); } } }
    size.push(n); total+=n;
  }
  // like OpenFront's generator on its full-size maps: islands too small to fight over become sea
  const minIsle=Math.round(MIN_ISLE*Math.sqrt(total/REF_LAND));
  for (let c=0;c<N;c++) if (land[c] && size[comp[c]]<minIsle){ land[c]=0; water[c]=1; terr[c]=0; base[c]=rgb(126,170,203); total--; }
  for (let c=0;c<N;c++) if (water[c] && base[c]===rgb(126,170,203)){ let near=false; for (let j=0;j<4;j++){ const d=nbr(M,c,j); if (d>=0 && land[d]) near=true; } if (!near) base[c]=rgb(68,130,178); }
  M.comp=comp; M.size=size; M.total=total;
  let nl=0; for (let c=0;c<N;c++) nl+=land[c]; M.li=new Int32Array(nl); nl=0; for (let c=0;c<N;c++) if (land[c]) M.li[nl++]=c;
  M.k = total/REF_LAND;                       // how much bigger than the world map
  M.nations = [];
  const sx = W/man.map.width, sy = H/man.map.height;
  for (const n of man.nations){
    const x=Math.round(n.coordinates[0]*sx), y=Math.round(n.coordinates[1]*sy); let best=-1, bd=1e9;
    for (let dy=-6;dy<=6;dy++) for (let dx=-6;dx<=6;dx++){
      const X=x+dx, Y=y+dy; if (X<0||Y<0||X>=W||Y>=H) continue;
      const c=Y*W+X, d=dx*dx+dy*dy; if (land[c] && size[comp[c]]>=30 && d<bd){ bd=d; best=c; }
    }
    if (best>=0) M.nations.push({name:n.name,c:best});
  }
  return built[mi]=M;
}
function nbr(M,c,k){
  const W=M.W;
  if (k===0) return c%W>0 ? c-1 : -1;
  if (k===1) return c%W<W-1 ? c+1 : -1;
  if (k===2) return c>=W ? c-W : -1;
  return c<M.N-W ? c+W : -1;
}

/* ---------- bots ---------- */
const weakest = (list,f) => list.reduce((b,q)=>!b||f(q)<f(b)?q:b, null);
const FL = {
  tortoise:{label:'Tortoise', desc:'Sits tight. Hits only the weak, or whoever hit it first.', keepN:.5, fracN:.3,
    pick(P,nb,full){
      const h = nb.find(q=>q.id===P.lastHit);
      if (h && full>.4) return {to:h.id,frac:.4};
      const w = weakest(nb,q=>q.troops);
      if (w && full>.65 && w.troops<.5*P.troops) return {to:w.id,frac:.35};
    }},
  berserker:{label:'Berserker', desc:'Throws most of its troops at a neighbour, again and again.', keepN:.2, fracN:.5, eager:true,
    pick(P,nb,full){
      if (!nb.length || full<.3) return;
      let sum=0; for (const q of nb) sum+=G.adj[P.id*G.n1+q.id];
      let r=G.rnd()*sum; for (const q of nb){ r-=G.adj[P.id*G.n1+q.id]; if (r<=0) return {to:q.id,frac:.7}; }
    }},
  vulture:{label:'Vulture', desc:'Waits for a neighbour to be busy or drained, then moves in.', keepN:.3, fracN:.4,
    pick(P,nb,full){
      if (full<.45) return;
      const busy = q => G.attacks.some(a=>!a.dead && ((a.to===q.id && a.from!==P.id) || (a.from===q.id && a.to!==0)));
      const w = weakest(nb.filter(q=>q.troops<.6*P.troops || (busy(q) && q.troops<P.troops)), q=>q.troops);
      if (w) return {to:w.id,frac:.5};
    }},
  leveller:{label:'Leveller', desc:'Goes after whoever holds the most land, by sea if it must.', keepN:.3, fracN:.4,
    pick(P,nb,full){
      const lead = weakest(G.players.filter(q=>q.alive && q.id!==P.id), q=>-q.tiles);
      if (!lead) return;
      if (nb.includes(lead)){ if (full>.6) return {to:lead.id,frac:.35}; }
      else if (full>.6 && G.rnd()<.5) return {to:lead.id,frac:.3,boat:true};
    }},
  corsair:{label:'Corsair', desc:'Lives on boats.', keepN:.3, fracN:.4, sailor:true,
    pick(P,nb,full){
      const w = weakest(nb,q=>q.troops);
      if (w && full>.6 && w.troops<.8*P.troops) return {to:w.id,frac:.4};
    }},
  banker:{label:'Banker', desc:'Saves until it is full, then spends big on the thinnest neighbour.', keepN:.4, fracN:.5,
    pick(P,nb,full){
      if (full<.75) return;
      const w = weakest(nb,q=>q.troops/q.tiles);
      if (w) return {to:w.id,frac:.6};
    }},
  mason:{label:'Mason', desc:'Builds cities and posts first, and marches late with a huge army.', keepN:.5, fracN:.3, builder:true,
    pick(P,nb,full){
      if (full<.85) return;
      const w = weakest(nb,q=>q.troops/q.tiles);
      if (w) return {to:w.id,frac:.5};
    }},
  diplomat:{label:'Diplomat', desc:'Allies with many, and fights only those it has a grudge against.', keepN:.3, fracN:.4, allies:4, asks:.4,
    pick(P,nb,full){
      if (full<.5) return;
      const w = weakest(nb.filter(q=>relOf(P.id,q.id)<0), q=>relOf(P.id,q.id));
      if (w) return {to:w.id,frac:.4};
    }},
  judas:{label:'Judas', desc:'Quick to ally, and breaks it the moment the ally looks weaker.', keepN:.3, fracN:.4, allies:3, asks:.3, betray:1.5,
    pick(P,nb,full){
      if (full<.45) return;
      const w = weakest(nb.filter(q=>q.troops<.8*P.troops), q=>q.troops);
      if (w) return {to:w.id,frac:.5};
    }},
  bully:{label:'Bully', desc:'Always picks on its smallest neighbour.', keepN:.3, fracN:.4,
    pick(P,nb,full){
      if (full<.4) return;
      const w = weakest(nb,q=>q.tiles);
      if (w) return {to:w.id,frac:.45};
    }},
  reaver:{label:'Reaver', desc:'Many small raids on every side at once.', keepN:.2, fracN:.3, eager:true, multi:4,
    pick(P,nb,full){
      if (!nb.length || full<.25) return;
      return {to:nb[(G.rnd()*nb.length)|0].id,frac:.15};
    }},
};
// nation troop cap and growth by difficulty are OpenFront's (Config.troopCap, troopIncreaseRate)
// 'bias' is how often a nation that you have not attacked will go for you rather than leave you be
// Easy and Normal sit close together on purpose: results swing sharply with these numbers. The larger
// difference is diplomacy (on Normal nations refuse runaway leaders, court the strong, and will betray you).
// Hard's cap was 1 (OpenFront's); at .8 a scripted player wins about one match in eight instead of one in thirty.
const DIFF = {easy:{cap:.57,grow:.87,start:14000,think:[40,64],bias:.3}, normal:{cap:.6,grow:.88,start:15000,think:[36,58],bias:.38}, hard:{cap:.8,grow:1,start:25000,think:[12,20],bias:1}};
const GRACE={easy:700,normal:600,hard:50};
const GOLD=300, GOLD_LAND=2500;                 // gold a tick: a base, plus more the larger your share of the land
const ALLY_T=3000, REQ_COOL=300, ASK_T=200, TRAITOR_T=300, RETREAT=.75;
const COLS = ['#000000','#ffd23f','#e6194b','#3cb44b','#4363d8','#f58231','#911eb4','#42d4f4','#f032e6','#9a6324','#008080','#bfef45','#fabed4','#800000','#aaffc3','#dcbeff','#808000'];

/* ---------- rules (after OpenFront's EngineConfig) ---------- */
const MAG=[80,100,120], TCOST=[16.5,20,25];        // plains, highland, mountain

// weapons bought with gold: price, blast radius in cells on the world map (wider on bigger maps), and the share

const ARMS=[{name:'Missile',ico:'🚀',cost:150000,r:10,kill:2},{name:'Nuke',ico:'☢️',cost:750000,r:26,kill:2}], MISSILE_V=6;

/* ---------- game state ---------- */
let ME = 1, NET = null;                      // my player id; the connection when playing over the network
const SPAWN_T = 100, NET_SUB = 4;           // network games: ticks to choose a start, and sub-steps per tick
let G = null, speed = 1, paused = true, armed = 0, popCell = -1, natCell = -1, natWho = 0, askFrom = 0, answered = {}, tapX = 0, tapY = 0, pressT = 0;
const save = (() => { try { return JSON.parse(localStorage.getItem('landmark.v1')) || {}; } catch(e){ return {}; } })();
save.diff = save.diff || 'easy'; save.wins = save.wins || {}; save.bots = save.bots || 6;
const persist = () => { try { localStorage.setItem('landmark.v1', JSON.stringify(save)); } catch(e){} };

function newGame(M, diff, seed, nbots, humans){

  for (let i=nat.length-1;i>0;i--){ const j=(rnd()*(i+1))|0; [nat[i],nat[j]]=[nat[j],nat[i]]; }

  G.adj = new Int32Array(G.n1*G.n1); G.cx = new Float64Array(G.n1); G.cy = new Float64Array(G.n1);

}
function touch(c){ const g=G; if (!g.dflag[c]){ g.dflag[c]=1; g.dirty.push(c); } }
function give(c,p){
  const g=G, M=g.M, A=g.players[g.owner[c]], B=g.players[p], b=g.bld[c];
  const a=A.id, n1=g.n1, adj=g.adj, owner=g.owner;
  A.tiles--; B.tiles++; owner[c]=p;
  if (b===1){ A.cities--; B.cities++; } else if (b===2){ A.forts.splice(A.forts.indexOf(c),1); B.forts.push(c); }
  // adj[x][y] counts the places where x's land meets y's, fords included
  for (let k=0;k<4;k++){
    let d=nbr(M,c,k); if (d<0) continue;
    touch(d);
    if (!M.land[d]){ if (!M.water[d]) continue; d=reach(M,c,k); if (d<0) continue; }
    const o=owner[d];
    if (o!==a){ adj[a*n1+o]--; adj[o*n1+a]--; }
    if (o!==p){ adj[p*n1+o]++; adj[o*n1+p]++; }
  }
  const bi=((((c/M.W)|0)/M.blk|0))*g.bw+(c%M.W/M.blk|0);
  g.blk[a*g.bh*g.bw+bi]--; g.blk[p*g.bh*g.bw+bi]++;
  touch(c);
}
function spawn(p, c){
  const {M,owner,players} = G, P = players[p], x0=c%M.W, y0=(c/M.W)|0;
  const r=2*M.sc;
  for (let dy=-r;dy<=r;dy++) for (let dx=-r;dx<=r;dx++){
    if (dx*dx+dy*dy>r*r+1) continue;
    const x=x0+dx, y=y0+dy; if (x<0||y<0||x>=M.W||y>=M.H) continue;
    const d=y*M.W+x; if (M.land[d] && owner[d]===0) give(d,p);
  }
  P.troops = 25000; P.alive = true; P.spawned = true;
}
function scan(){
  const {M,cx,cy,n1,blk,bw,bh} = G;
  // label anchor: the 3x3 group of blocks holding most of the owner's land; keep the old one unless clearly beaten
  for (let o=1;o<n1;o++){
    const at=(x,y)=>x<0||y<0||x>=bw||y>=bh?0:blk[(o*bh+y)*bw+x];
    const sum=(x,y)=>{ let t=0; for (let j=-1;j<=1;j++) for (let i=-1;i<=1;i++) t+=at(x+i,y+j); return t; };
    let best=-1, bv=0;
    for (let y=0;y<bh;y++) for (let x=0;x<bw;x++){ if (!at(x,y)) continue; const v=sum(x,y); if (v>bv){ bv=v; best=y*bw+x; } }
    if (best<0) continue;
    const cur=G.lb[o]; if (cur>=0 && sum(cur%bw,(cur/bw)|0)*1.25>=bv) best=cur;
    G.lb[o]=best; const bx=best%bw, by=(best/bw)|0; let sx=0, sy=0, n=0;
    for (let j=-1;j<=1;j++) for (let i=-1;i<=1;i++){ const v=at(bx+i,by+j); sx+=v*(bx+i+.5); sy+=v*(by+j+.5); n+=v; }
    cx[o]=sx/n*M.blk; cy[o]=sy/n*M.blk;
    if (G.lx[o]<0){ G.lx[o]=cx[o]; G.ly[o]=cy[o]; }
  }
}
// the land cell reached from c in direction k: next door, or across a narrow strip of water
function reach(M,c,k){
  let d=c;
  for (let i=0;i<=M.ford;i++){ d=nbr(M,d,k); if (d<0) return -1; if (M.land[d]) return d; if (!M.water[d]) return -1; }
  return -1;
}
const hot = c => G.burn[c]>G.tick;
function ownNb(c,p){ const {M,owner}=G; let n=0; for (let k=0;k<4;k++){ const d=nbr(M,c,k); if (d>=0 && M.land[d] && owner[d]===p) n++; } return n; }
function touches(c,p){ const {M,owner}=G; for (let k=0;k<4;k++){ const d=reach(M,c,k); if (d>=0 && owner[d]===p) return true; } return false; }
// the cells of a.to that a.from's land touches. With `probe`, only says whether there is one.
function scanFront(a,probe){
  const {M,owner,stamp,blk,bw,bh}=G, B=M.blk, W=M.W, H=M.H; if (!probe) a.front.length=0;
  // only look inside blocks where the target has land and the attacker has land in or beside them
  const T=a.to*bh*bw, F=a.from*bh*bw;
  for (let by=0;by<bh;by++) for (let bx=0;bx<bw;bx++){
    if (!blk[T+by*bw+bx]) continue;
    let near=false;
    for (let j=-1;j<=1 && !near;j++) for (let i=-1;i<=1;i++){ const x=bx+i, y=by+j; if (x>=0 && y>=0 && x<bw && y<bh && blk[F+y*bw+x]){ near=true; break; } }
    if (!near) continue;
    const x1=Math.min(W,(bx+1)*B), y1=Math.min(H,(by+1)*B);
    for (let y=by*B;y<y1;y++) for (let x=bx*B;x<x1;x++){ const c=y*W+x; if (M.land[c] && owner[c]===a.to && !hot(c) && touches(c,a.from)){ if (probe) return true; a.front.push(c); stamp[c]=a.id; } }
  }
  return false;
}
// is there unclaimed land beside p's that p could take now? (adj counts scorched land too)
const openTo = p => G.adj[p*G.n1]>0 && (G.tick>=G.burnEnd || scanFront({from:p,to:0},true));
function take(c,p,a){
  const {M,owner,players,stamp}=G;
  give(c,p);
  for (let k=0;k<4;k++){
    const d=nbr(M,c,k); if (d<0 || !M.land[d] || owner[d]===p) continue;
    const o=owner[d];
    if (o>0 && players[o].tiles>1){          // a boxed-in single cell gives up
      let lone=true; for (let j=0;j<4;j++){ const e=nbr(M,d,j); if (e>=0 && M.land[e] && owner[e]!==p){ lone=false; break; } }
      if (lone){ give(d,p); continue; }
    }
    if (a && o===a.to && stamp[d]!==a.id && !hot(d)){ stamp[d]=a.id; a.front.push(d); }
  }
  if (a) for (let k=0;k<4;k++){
    const d=nbr(M,c,k); if (d<0 || !M.water[d]) continue;
    const e=reach(M,c,k); if (e>=0 && owner[e]===a.to && stamp[e]!==a.id && !hot(e)){ stamp[e]=a.id; a.front.push(e); }
  }
}
// OpenFront's attackLogic for one tile: sets R.aLoss, R.dLoss, R.frac (share of a tick)
const R={aLoss:0,dLoss:0,frac:0};
function tileLogic(c,A,D,to,troops,border){
  const M=G.M, t=M.terr[c]; let mag=MAG[t], cost=TCOST[t];
  if (to>0){
    const x=c%M.W, y=(c/M.W)|0;
    for (const f of D.forts){ const dx=f%M.W-x, dy=((f/M.W)|0)-y; if (dx*dx+dy*dy<=POST_R*POST_R*M.sc*M.sc){ mag*=POST_MAG; cost*=POST_SPEED; break; } }
  }

    R.aLoss=mag/5*scale; R.dLoss=0;
    R.frac=within(2000*cost/troops,5,100)/(border*2)*pace; return;
  }
  const bA=bigBonus(tilesOF(A),.7), bD=bigBonus(tilesOF(D),.3);

  if (D.traitor>G.tick) R.aLoss*=.5;

}
function collapse(D,p){
  const g=G; if (D.human || D.tiles===0 || D.tiles>=g.M.total*COLLAPSE) return;
  for (let c=0;c<g.M.N && D.tiles>0;c++) if (g.owner[c]===D.id) give(c,p);
}
function endAttack(a){ a.dead=true; const A=G.players[a.from]; if (A.alive) A.troops+=a.troops; a.troops=0; }
/* ---------- diplomacy ---------- */
const allied = (a,b) => a>0 && b>0 && G.ally[a*G.n1+b]>G.tick;
const relOf = (a,b) => G.rel[a*G.n1+b];                       // how a feels about b, -100..100
function addRel(a,b,v){ const i=a*G.n1+b; G.rel[i]=within(G.rel[i]+v,-100,100); }
const alliesOf = p => G.players.filter(q=>q.alive && allied(p,q.id));
const isUser = P => P.human && !P.fl;
function makeAlly(a,b){
  const g=G, t=g.tick+ALLY_T; g.ally[a*g.n1+b]=g.ally[b*g.n1+a]=t; addRel(a,b,50); addRel(b,a,50);
  for (const x of g.attacks) if (!x.dead && ((x.from===a && x.to===b) || (x.from===b && x.to===a))) endAttack(x);
  const A=g.players[a], B=g.players[b]; A.asks=A.asks.filter(x=>x.from!==b); B.asks=B.asks.filter(x=>x.from!==a);
  if (a===ME || b===ME) toast('🤝 '+g.players[a===ME?b:a].name);
}
function breakAlly(p,q){
  const g=G; g.ally[p*g.n1+q]=g.ally[q*g.n1+p]=0; g.players[p].traitor=g.tick+TRAITOR_T;
  addRel(q,p,-100); for (const O of g.players) if (O.id>0 && O.id!==p && O.id!==q) addRel(O.id,p,-30);
  if (q===ME) toast('💔 '+g.players[p].name);

// would nation B ally with O? (after OpenFront's NationAllianceBehavior.getAllianceDecision)
function wantsAlly(B,O){
  const g=G, d=g.diff, r=g.rnd;
  if (d==='easy' && r()<.1) return r()<.5;
  if (O.traitor>g.tick && r()<.9) return false;
  if (d!=='easy'){
    let second=0; for (const Q of g.players) if (Q.alive && Q!==O) second=Math.max(second,Q.tiles);
    if (O.tiles>second*1.6 && O.tiles>g.M.total*.25) return false;        // don't feed a runaway leader
    if (O.troops>B.troops*2.5) return true;                                // too strong to refuse

  const rel=relOf(B.id,O.id);
  if (rel<0) return false;
  if (rel>=30) return true;
  if (alliesOf(B.id).length>=((B.fl && B.fl.allies)||2)) return false;
  if (g.tick<(d==='easy'?3000:1800)) return true;
  return O.troops>=B.troops*.6;
}
// A person keeps every request made to them until they answer it or it runs out; a new one never replaces another.
function request(p,q){
  const g=G, i=p*g.n1+q, P=g.players[p], Q=g.players[q]; if (allied(p,q)) return;
  if (P.asks.some(a=>a.from===q)){ makeAlly(q,p); return; }           // they had already asked me: this is my yes
  if (g.cool[i]>g.tick) return;
  g.cool[i]=g.tick+REQ_COOL;
  if (isUser(Q)){
    Q.asks=Q.asks.filter(a=>a.from!==p);
    const a={from:p,until:g.tick+ASK_T};
    if (isUser(P)){ let k=0; while (k<Q.asks.length && isUser(g.players[Q.asks[k].from])) k++; Q.asks.splice(k,0,a); }   // people ahead of computer nations
    else Q.asks.push(a);
    if (p===ME) toast('✉ '+Q.name);
    return;
  }
  if (wantsAlly(Q,P)) makeAlly(p,q); else if (p===ME) toast('✕ '+Q.name);

function retreat(a){ if (a.dead) return; a.dead=true; const A=G.players[a.from]; if (A.alive) A.troops+=a.troops*RETREAT; a.troops=0; }
function eliminate(D,by){
  D.alive=false; D.troops=0;

  for (const b of G.boats) if (b.p===D.id) b.dead=true;
  if (!D.human) toast(D.name+' ✕');

function commit(p,to,amt){
  const g=G;
  if (to>0){
    g.players[to].lastHit=p; addRel(to,p,-30); for (const A of alliesOf(to)) addRel(A.id,p,-10);
    const opp=g.attacks.find(a=>!a.dead && a.from===to && a.to===p);
    if (opp){ const m=Math.min(opp.troops,amt); opp.troops-=m; amt-=m; if (opp.troops<1) opp.dead=true; }
  }
  if (amt<1) return null;

  if (a) a.troops+=amt; else { a={id:++g.aid,from:p,to,troops:amt,front:[],budget:0,rescan:0}; g.attacks.push(a); }
  return a;
}
function order(p,to,amt){
  const P=G.players[p]; amt=Math.floor(Math.min(amt,P.troops)); const T=G.players[to];
  if (amt<1 || allied(p,to) || (T.human && P.fl && G.tick<G.grace)) return;
  if (T.human && P.fl && P.lastHit!==to && G.grace && G.rnd()>G.dm.bias) return;
  P.troops-=amt; commit(p,to,amt);
  if (to===ME && !P.human && G.tick-P.warn>80){ P.warn=G.tick; toast('⚔ '+P.name); }
}
function runAttack(a,f){
  const g=G, A=g.players[a.from], D=g.players[a.to];

  a.budget=Math.min(2,a.budget+f);
  let guard=0;
  while (a.budget>0 && guard++<600*g.M.sc*g.M.sc){
    if (!a.front.length){
      if (g.tick<a.rescan) return;

/* ---------- sea routes: breadth-first search over water ---------- */
// nearest landing by sea from p's coast. With `better`, a landing that passes it is preferred over the first
// plain one, as long as it turns up soon after; `limit` caps how much sea is searched (bots only).
// The search starts from p's coast, found through the blocks that hold p's land (never a pass over the whole map),
// and marks the sea it has visited with this search's number, so nothing needs clearing first.
// seaStart sets a search up; seaRun carries it on for up to `budget` cells and returns the path, null when there
// is no landing, or undefined when it has more sea to cover.
function seaStart(p, goal, better, limit){

  for (let by=0;by<bh;by++) for (let bx=0;bx<bw;bx++){
    if (!g.blk[base+by*bw+bx]) continue;
    const x1=Math.min(W,(bx+1)*B), y1=Math.min(H,(by+1)*B);
    for (let y=by*B;y<y1;y++) for (let x=bx*B, c=y*W+x; x<x1; x++, c++) if (owner[c]===p){
      if (x>0 && water[c-1] && seen[c-1]!==gen){ seen[c-1]=gen; par[c-1]=-1; q[t++]=c-1; }
      if (x<W-1 && water[c+1] && seen[c+1]!==gen){ seen[c+1]=gen; par[c+1]=-1; q[t++]=c+1; }
      if (y>0 && water[c-W] && seen[c-W]!==gen){ seen[c-W]=gen; par[c-W]=-1; q[t++]=c-W; }
      if (y<H-1 && water[c+W] && seen[c+W]!==gen){ seen[c+W]=gen; par[c+W]=-1; q[t++]=c+W; }
    }

function seaRun(s, budget){

  const path=(c,d)=>{ const r=[d]; for (let w=c;w>=0;w=par[w]) r.push(w); return r.reverse(); };

    if (budget--<=0){ s.h=h; s.t=t; return undefined; }
    const c=q[h++], x=c%W;

      const d=k===0?(x>0?c-1:-1):k===1?(x<W-1?c+1:-1):k===2?(c>=W?c-W:-1):(c<N-W?c+W:-1);
      if (d<0) continue;
      if (land[d]){
        if (owner[d]!==p && goal(d)){
          if (!better || better(d)) return path(c,d);
          if (s.fc<0){ s.fc=c; s.fd=d; s.stop=Math.min(s.max,h+extra); }
        }
      } else if (water[d] && seen[d]!==gen){ seen[d]=gen; par[d]=c; q[t++]=d; }
    }

// a whole search at once, for a player's tap. It uses the same working arrays, so a nation's search in progress is dropped.
function routeFrom(p, goal, better, limit){ G.plan=null; return seaRun(seaStart(p,goal,better,limit),Infinity); }
function routeTo(p, L){
  const {M,owner,par,q}=G; G.plan=null; par.fill(-2); let h=0,t=0;
  for (let k=0;k<4;k++){ const d=nbr(M,L,k); if (d>=0 && M.water[d]){ par[d]=-1; q[t++]=d; } }
  while (h<t){ const c=q[h++];
    for (let k=0;k<4;k++){ const d=nbr(M,c,k); if (d<0) continue;
      if (M.land[d]){ if (owner[d]===p){ const path=[]; for (let w=c;w>=0;w=par[w]) path.push(w); path.push(L); return path; } }
      else if (M.water[d] && par[d]===-2){ par[d]=c; q[t++]=d; } } }
  return null;
}
const boatsOf = p => G.boats.reduce((n,b)=>n+(!b.dead && b.p===p),0);
function sail(P,path,amt){ P.troops-=amt; G.boats.push({p:P.id,path,i:0,troops:amt}); }
function landBoat(b){
  const g=G, P=g.players[b.p], c=b.path[b.path.length-1], o=g.owner[c];
  if (!P.alive) return;
  if (o===b.p || allied(b.p,o) || hot(c)){ P.troops+=b.troops; return; }
  const D=g.players[o]; tileLogic(c,P,D,o,b.troops,1);
  if (b.troops<R.aLoss) return;
  if (o>0){ D.troops-=R.dLoss; if (o===ME && !P.human) toast('⛵ '+P.name); }
  const a=commit(b.p,o,b.troops-R.aLoss);
  take(c,b.p,a);
  if (o>0) collapse(D,b.p);
  if (o>0 && D.tiles===0) eliminate(D,P);
}
function build(p,c,type){
  const g=G, P=g.players[p], cost=type===1?cityCost(P):fortCost(P);
  if (g.owner[c]!==p || g.bld[c] || P.gold<cost) return false;
  P.gold-=cost; g.bld[c]=type; g.blds.push(c);
  if (type===1) P.cities++; else P.forts.push(c);
  return true;
}
/* ---------- missiles ---------- */
// p pays for weapon w at the land under c. It flies from the middle of p's land and lands some ticks later.
function launch(p,c,w){
  const g=G, {M,owner}=g, P=g.players[p], o=owner[c], A=ARMS[w];
  if (!M.land[c] || o===0 || o===p || allied(p,o) || P.gold<A.cost) return;
  P.gold-=A.cost;
  const x=g.cx[p], y=g.cy[p], dx=c%M.W+.5-x, dy=((c/M.W)|0)+.5-y;
  g.missiles.push({p,w,x,y,c,t0:g.tick,at:g.tick+Math.max(8,Math.ceil(Math.sqrt(dx*dx+dy*dy)/(MISSILE_V*M.sc))),r:Math.round(A.r*Math.sqrt(M.k))});
  if (o===ME) toast(A.ico+' '+P.name);
}
// It lands: inside the circle, land that is not the sender's or an ally's goes back to unclaimed, buildings on it
// are gone, and each nation hit loses troops by the share of its land it lost. All the unclaimed land in the circle
// is then scorched for SCORCH ticks.
function blast(m){
  const g=G, {M,owner}=g, {W,H}=M, P=g.players[m.p], R=m.r, x0=m.c%W, y0=(m.c/W)|0;
  if (!P.alive) return;
  const lost=new Int32Array(g.n1), had=g.players.map(D=>D.tiles), until=g.tick+SCORCH, cells=[];
  for (let dy=-R;dy<=R;dy++) for (let dx=-R;dx<=R;dx++){
    if (dx*dx+dy*dy>R*R) continue;
    const X=x0+dx, Y=y0+dy; if (X<0||Y<0||X>=W||Y>=H) continue;
    const c=Y*W+X, o=owner[c]; if (!M.land[c] || o===m.p || allied(m.p,o)) continue;
    if (o){
      const b=g.bld[c];
      if (b){ const D=g.players[o]; if (b===1) D.cities--; else D.forts.splice(D.forts.indexOf(c),1); g.bld[c]=0; g.blds.splice(g.blds.indexOf(c),1); }
      give(c,0); lost[o]++;
    }
    g.burn[c]=until; cells.push(c); touch(c);
  }
  g.burns.push({until,cells}); g.burnEnd=until;

    const D=g.players[o];
    D.troops-=D.troops*Math.min(1,ARMS[m.w].kill*lost[o]/had[o]);
    D.lastHit=m.p; addRel(o,m.p,-30); for (const A of alliesOf(o)) addRel(A.id,m.p,-10);
    if (D.tiles===0) eliminate(D,P);
  }
  g.fx.push({x:x0+.5,y:y0+.5,t:performance.now(),r:R,d:800+600*m.w});
}
// Computer nations' weapons (Normal and Hard). After each buy a nation draws what it saves for next: mostly a city,
// often a missile, and once it has two cities now and then a nuke. So it never saves for weapons only.
const nextWant = P => { const r=G.rnd(); return P.cities>=2 && r<.15 ? 2 : r<.5 ? 1 : 0; };
// whom P would fire at: the nation it is fighting, was last hit by or likes least. Nobody, if it has no quarrel.
function foeOf(P){
  const g=G, p=P.id; let best=null, bs=0;
  for (const Q of g.players){
    if (!Q.alive || Q.id===p || allied(p,Q.id) || (Q.human && g.tick<g.grace)) continue;
    let v=-relOf(p,Q.id); if (Q.id===P.lastHit) v+=30;
    if (g.attacks.some(a=>!a.dead && ((a.from===p && a.to===Q.id) || (a.from===Q.id && a.to===p)))) v+=50;
    if (v>bs){ bs=v; best=Q; }
  }
  return best;
}
// where on T's land to drop weapon w: of T's cities and a few of its cells drawn at random, the one whose circle
// holds the most land of nations P is not allied with, a city in it counting as about a fifth of the circle
function aim(P,T,w){
  const g=G, {M,owner}=g, {W,H}=M, p=P.id, R=Math.round(ARMS[w].r*Math.sqrt(M.k)), city=(R*R*3/5)|0, cand=[];
  for (const c of g.blds) if (owner[c]===T.id && g.bld[c]===1) cand.push(c);
  for (let t=0, n=0; t<400 && n<8; t++){ const c=M.li[(g.rnd()*M.li.length)|0]; if (owner[c]===T.id){ cand.push(c); n++; } }
  let best=-1, bs=-1;
  for (const c0 of cand){
    const x0=c0%W, y0=(c0/W)|0; let v=0;
    for (let dy=-R;dy<=R;dy++){
      const Y=y0+dy; if (Y<0 || Y>=H) continue;
      for (let dx=-R;dx<=R;dx++){
        if (dx*dx+dy*dy>R*R) continue;
        const X=x0+dx; if (X<0 || X>=W) continue;
        const c=Y*W+X, o=owner[c]; if (o && o!==p && !allied(p,o)) v+=g.bld[c]===1?city:1;
      }
    }
    if (v>bs){ bs=v; best=c0; }
  }

}
function pickCell(p,ok){ const g=G; for (let t=0;t<600;t++){ const c=(g.rnd()*g.M.N)|0; if (g.owner[c]===p && !g.bld[c] && ok(c)) return c; } return -1; }

/* ---------- bot turn ---------- */
// A computer nation's search for a landing. It is spread over ticks, PLAN_STEP cells of sea at a time, and only one
// runs at once in the whole game, so no tick carries a whole search. `key` names the kind of target (0 unclaimed
// land, -1 anyone, else a nation). A search that finds no landing is the dearest kind, running to its cap, so after
// one a nation waits before looking for that kind again: 30 seconds, doubling each time it fails, up to four minutes.
const PLAN_STEP=8000;
function botBoat(P,f,goal,key){
  const g=G;
  if (g.plan || boatsOf(P.id)>=2 || Math.floor(P.troops*f)<2000) return false;
  const spare=g.grace && (g.tick<g.grace || g.rnd()>g.dm.bias);
  const nb=P.nb||(P.nb={}), k=spare?key+'s':key, w=nb[k]; if (w && g.tick<w.until) return false;
  const ok=c=>goal(c) && !hot(c) && !allied(P.id,G.owner[c]) && !(spare && G.players[G.owner[c]].human && P.lastHit!==G.owner[c]);
  // prefer a landing with the target's land behind it, not a one-tile islet
  g.plan={P,f,k,s:seaStart(P.id,ok,c=>ownNb(c,G.owner[c])>=2,60000*g.M.sc*g.M.sc)};
  return true;
}
function stepPlan(){
  const g=G, pl=g.plan; if (!pl) return;
  const P=pl.P; if (!P.alive){ g.plan=null; return; }
  const path=seaRun(pl.s,PLAN_STEP); if (path===undefined) return;
  g.plan=null; const w=P.nb[pl.k];
  if (!path){ const n=w?w.n+1:1; P.nb[pl.k]={until:g.tick+300*Math.min(8,1<<(n-1)),n}; return; }
  delete P.nb[pl.k];
  const amt=Math.floor(P.troops*pl.f); if (amt>=2000 && boatsOf(P.id)<2) sail(P,path,amt);
}
function think(P){
  const g=G, p=P.id, fl=P.fl, full=P.troops/capOf(P), owner=g.owner;
  const near=[]; for (let q=1;q<g.n1;q++) if (q!==p && g.players[q].alive && g.adj[p*g.n1+q]>0) near.push(g.players[q]);
  const nb=near.filter(q=>!allied(p,q.id));
  // diplomacy: sometimes ask a neighbour; drop an ally that has become easy meat
  if (g.rnd()<(fl.asks||.12) && alliesOf(p).length<(fl.allies||2)){
    const Q=near[(g.rnd()*near.length)|0];
    if (Q && !allied(p,Q.id) && relOf(p,Q.id)>=0 && wantsAlly(P,Q)) request(p,Q.id);
  }
  for (const Q of alliesOf(p)) if (P.troops>=Q.troops*(fl.betray||10) && !(g.diff==='easy' && isUser(Q))) breakAlly(p,Q.id);
  const neutral=openTo(p), mine=g.attacks.filter(a=>!a.dead && a.from===p);

    const c=pickCell(p,c=>touches(c,P.lastHit)); if (c>=0) build(p,c,2);
  }
  const arms=g.diff!=='easy' && !P.human;
  if (arms && P.want){                        // saving for a weapon (1 missile, 2 nuke)
    const w=P.want-1;
    if (P.gold>=ARMS[w].cost){
      const T=foeOf(P);
      if (!T) P.want=0;                       // no quarrel with anyone: back to cities
      else if (!(T.human && P.lastHit!==T.id && g.rnd()>g.dm.bias)){
        const c=aim(P,T,w), gold=P.gold; if (c>=0) launch(p,c,w);
        if (P.gold<gold) P.want=nextWant(P);
      }
    }
  }
  else if (P.gold>=cityCost(P)){ const c=pickCell(p,c=>ownNb(c,p)===4); if (c>=0 && build(p,c,1) && arms) P.want=nextWant(P); }
  if (fl.builder && P.forts.length<5 && P.gold>=fortCost(P)+cityCost(P) && nb.length){ const Q=nb[(g.rnd()*nb.length)|0], c=pickCell(p,c=>touches(c,Q.id)); if (c>=0) build(p,c,2); }
  if (mine.length>=(fl.multi||2)) return;

    }

  }

  // anyone finishes off a neighbour that is nearly gone

    if (far && botBoat(P,Math.min(.4,far.troops*3/P.troops),c=>owner[c]===far.id,far.id)) return;

  if (w && full>.5 && w.troops/w.tiles<.35*P.troops/P.tiles){ order(p,w.id,P.troops*.4); return; }
  if (full>.9 && w && g.rnd()<.4) order(p,w.id,P.troops*.4);
}

/* ---------- time ---------- */
// borders and boats move every frame; f is the share of a 100 ms tick that has passed
function advance(f){
  const g=G;
  for (let i=0;i<g.attacks.length;i++) if (!g.attacks[i].dead) runAttack(g.attacks[i],f);
  for (let i=0;i<g.boats.length;i++){ const b=g.boats[i]; if (b.dead) continue; b.i+=.5*g.M.sc*f; if (b.i>=b.path.length-1){ b.dead=true; landBoat(b); } }
}
function tick(){
  const g=G; g.tick++; g.tat=performance.now();       // tat: when, for drawing between ticks
  if (g.mp && g.tick<=SPAWN_T){              // network games open with a few seconds for everyone to choose a start
    if (g.tick===SPAWN_T){
      for (const P of g.players) if (P.human && !P.spawned) for (let t=0;t<4000 && !P.spawned;t++){
        const c=(g.rnd()*g.M.N)|0; if (g.M.land[c] && g.owner[c]===0 && g.M.size[g.M.comp[c]]>=200) spawn(P.id,c);
      }
      g.grace=g.tick+GRACE[g.diff]; scan();
    }
    return;
  }
  if (g.tick%8===1) scan();
  for (const P of g.players) if (P.alive){
    const cap=capOf(P), m=P.human?1:g.dm.grow;
    if (P.troops<cap) P.troops=Math.min(cap,P.troops+(10+pw(P.troops,.73)/4)*(1-P.troops/cap)*m);
    else P.troops-=(P.troops-cap)*.02;
    P.gold+=GOLD+GOLD_LAND*P.tiles/g.M.total;
  }
  for (const P of g.players) if (P.alive && P.fl && g.tick>=P.next){
    think(P); const [a,b]=g.dm.think; P.next=g.tick+a+((g.rnd()*(b-a))|0);
  }
  stepPlan();
  if (g.missiles.length){
    for (const m of g.missiles) if (g.tick>=m.at){ m.dead=true; blast(m); }
    g.missiles=g.missiles.filter(m=>!m.dead);
  }
  while (g.burns.length && g.tick>=g.burns[0].until) for (const c of g.burns.shift().cells) if (!hot(c)) touch(c);      // scorched land clears: paint it again
  if (g.tick%100===0) for (let i=0;i<g.rel.length;i++){ const v=g.rel[i]; if (v) g.rel[i]=v>0?Math.max(0,v-2):Math.min(0,v+2); }
  if (g.tick%10===0) for (let a=1;a<g.n1;a++) for (let b=a+1;b<g.n1;b++){
    const t=g.ally[a*g.n1+b]; if (!t || t>g.tick) continue;
    g.ally[a*g.n1+b]=g.ally[b*g.n1+a]=0;
    if (a===ME || b===ME){ const Q=g.players[a===ME?b:a]; if (Q.alive) toast('⏳ '+Q.name); }
  }
  for (const P of g.players) if (P.asks.length) P.asks=P.asks.filter(a=>{
    if (g.tick<=a.until && P.alive && g.players[a.from].alive) return true;
    if (a.from===ME && P.alive) toast('✕ '+P.name);                 // my request ran out unanswered
    return false;
  });
  g.attacks=g.attacks.filter(a=>!a.dead); g.boats=g.boats.filter(b=>!b.dead);
  for (const P of g.players) if (P.human && P.alive && P.tiles===0) eliminate(P,P);
  const me=g.players[ME];
  if (me.spawned && !me.alive){
    if (!g.mp){ finish(false); return; }
    if (!g.lost){ g.lost=true; endCard(false); }      // out of a network game: keep watching
  }
  // once one side holds most of the map, nations down to scraps give up to it
  if (g.tick%50===0){
    const top=weakest(g.players.filter(P=>P.alive),P=>-P.tiles);
    if (top && top.tiles>=g.M.total*DOMINANT) for (const D of g.players) if (D.alive && D!==top && !D.human && D.tiles<g.M.total*SCRAP && !allied(top.id,D.id)){
      for (let c=0;c<g.M.N && D.tiles>0;c++) if (g.owner[c]===D.id) give(c,top.id);
      eliminate(D,top);
    }
  }
  const left=g.players.filter(P=>P.alive);
  if (left.length===1) finish(left[0].id===ME);
}
function finish(won){
  const g=G; g.phase='over'; g.won=won;
  if (g.silent) return;
  if (won && !g.mp){ const k=g.M.id+'/'+g.diff; save.wins[k]=(save.wins[k]||0)+1; persist(); }
  endCard(won);
}
function endCard(won){
  const g=G, s=Math.round(g.tick/10);
  $('again').style.display=g.mp?'none':'';
  $('endT').textContent=won?'Victory':'Defeat';
  $('endS').textContent=g.M.name+' · '+g.diff+' · '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  setTimeout(()=>$('end').classList.remove('hidden'),700);

/* ---------- actions ---------- */
// The only ways a player changes the game. Alone, they apply at once; over the network the server
// hands every device the same actions for the same tick.
function apply(p,it){
  const g=G, P=g.players[p]; if (!P || !P.human || !it) return;
  const N=g.M.N, cell=c=>Number.isInteger(c) && c>=0 && c<N;
  switch (it.k){
    case 'spawn':
      if (P.spawned || !cell(it.c) || !g.M.land[it.c] || g.owner[it.c]!==0) break;
      if (g.mp ? g.tick>=SPAWN_T : g.phase!=='spawn') break;
      spawn(p,it.c);
      if (!g.mp){ g.phase='play'; paused=false; g.grace=g.tick+GRACE[g.diff]; }
      scan(); if (p===ME) focusOn(it.c);
      break;
    case 'tap': if (P.alive && cell(it.c)) doTap(p,it.c,+it.f,!!it.boat); break;
    case 'build': if (P.alive && cell(it.c) && (it.t===1 || it.t===2)) build(p,it.c,it.t); break;
    case 'nuke': if (P.alive && cell(it.c) && (it.w===0 || it.w===1)) launch(p,it.c,it.w); break;
    case 'req': if (P.alive && Number.isInteger(it.q) && it.q>0 && it.q<g.n1 && it.q!==p && g.players[it.q].alive) request(p,it.q); break;
    // the answer names who it is for, so it can never land on a different request
    case 'yes': if (P.alive && P.asks.some(a=>a.from===it.q) && g.players[it.q].alive) makeAlly(it.q,p); break;
    case 'no': if (P.asks.some(a=>a.from===it.q)){ P.asks=P.asks.filter(a=>a.from!==it.q); addRel(it.q,p,-10); if (it.q===ME) toast('✕ '+P.name); } break;
    case 'break': if (Number.isInteger(it.q) && allied(p,it.q)) breakAlly(p,it.q); break;
    case 'retreat': { const a=g.attacks.find(a=>a.id===it.a && a.from===p); if (a) retreat(a); } break;
  }
}
function act(it){ if (G.mp){ it.z=Math.round(performance.now()); NET.send(it); } else apply(ME,it); }      // z: when it left, to time the round trip
// Land over a river is a region of its own to the flood in doTap, yet an attack crosses narrow water. Can p's land
// be reached from c, walking over o's land and narrow water? A nation's land counts however far the walk: an attack
// on it by land gets there. Unclaimed land counts within NEAR steps (the far bank of a river p's border has not
// reached yet); unclaimed land joined only by a far strait (Africa from France) stays a boat trip.
const NEAR=40;
function byLand(p,c,o){
  const g=G, {M,owner,seen}=g, gen=++g.gen, q=[c]; seen[c]=gen;
  for (let h=0, end=1, left=o?Infinity:NEAR*M.sc; h<q.length; h++){
    if (h===end){ if (--left<=0) return false; end=q.length; }
    const s=q[h];
    for (let k=0;k<4;k++){ const d=reach(M,s,k); if (d<0) continue;
      if (owner[d]===p) return true;
      if (owner[d]===o && seen[d]!==gen && !hot(d)){ seen[d]=gen; q.push(d); } }
  }
  return false;
}
// send a share f of p's troops at the land under cell c: by land if an attack by land can get there, else by boat.
// Scorched land is no target, and nothing walks over it.
function doTap(p,c,f,byBoat){
  const g=G, {M,owner,mark}=g, P=g.players[p]; if (!M.land[c] || hot(c)) return;
  const o=owner[c], amt=Math.floor(P.troops*within(f||0,.05,1));
  if (o===p){ if (amt>=100 && openTo(p)) order(p,0,amt); return; }
  if (allied(p,o) || amt<100) return;
  // flood the tapped region: does it touch p's land?
  mark.fill(0); const st=[c], coast=[]; mark[c]=1; let touch=false;
  while (st.length){ const s=st.pop(); let sea=false;
    for (let k=0;k<4;k++){ const d=nbr(M,s,k); if (d<0) continue;
      if (M.water[d]){ sea=true; const e=reach(M,s,k); if (e>=0 && owner[e]===p) touch=true; } else if (!M.land[d]) continue; else if (owner[d]===p) touch=true; else if (owner[d]===o && !mark[d] && !hot(d)){ mark[d]=1; st.push(d); } }
    if (sea) coast.push(s); }
  if (!byBoat && (touch || byLand(p,c,o))){ order(p,o,amt); return; }
  if (boatsOf(p)>=3) return;
  let path=null;
  if (coast.length){
    const x=c%M.W, y=(c/M.W)|0;
    path=routeTo(p, weakest(coast,s=>{ const dx=s%M.W-x, dy=((s/M.W)|0)-y; return dx*dx+dy*dy; }));
  }
  if (!path) path=routeFrom(p,d=>mark[d]===1);
  if (path) sail(P,path,amt);
}

/* ---------- the player's tap ---------- */
function tapCell(c,byBoat){
  const g=G, me=g.players[ME], o=g.owner[c];
  if (!me.spawned){ if (o===0) act({k:'spawn',c}); return; }
  if (g.phase!=='play' || !me.alive) return;
  if (armed){ if (armed>=3){ if (o>0 && o!==ME && !allied(ME,o)) act({k:'nuke',c,w:armed-3}); } else if (o===ME) act({k:'build',c,t:armed}); arm(0); return; }
  // while there is unclaimed land next to you a tap on your own land pushes into it; the bar buttons build
  if (o===ME && !openTo(ME)){ if (!g.bld[c] && me.gold>=Math.min(cityCost(me),fortCost(me))) openPop(c); return; }
  if (o!==ME && allied(ME,o)){ openNat(c); return; }
  act({k:'tap',c,f:$('ratio').value/100,boat:!!byBoat});
}

const cv=$('c'), ctx=cv.getContext('2d'), gcv=document.createElement('canvas'), gctx=gcv.getContext('2d');

function fit(){

  V.min=Math.min(cw/W,(ch-top-bot)/H); V.s=V.min; V.x=(cw-W*V.s)/2; V.y=top+((ch-top-bot)-H*V.s)/2;
}
const maxZoom = () => Math.max(V.min*4,14);
function clampView(){
  const {W,H}=G.M; V.s=within(V.s,V.min,maxZoom());

  const top=40, bot=112, w=W*V.s, h=H*V.s, ah=ch-top-bot;
  V.x = w<=cw ? (cw-w)/2 : within(V.x,cw-w,0);

// on small screens, move in on the starting spot
function focusOn(c){ const {W}=G.M; const want=Math.max(V.min,Math.min(cw,ch)/75/G.M.sc); if (want<=V.min*1.15) return; V.s=want; V.x=cw/2-(c%W+.5)*V.s; V.y=ch/2-36-(((c/W)|0)+.5)*V.s; clampView(); }

function hud(){

  const rank=g.players.slice(1).filter(P=>P.alive||P.human).sort((a,b)=>b.tiles-a.tiles);
  const show=rank.slice(0,5); if (!show.includes(me)) show.push(me);
  $('top').innerHTML=show.map(P=>'<span class="chip"><i style="background:'+COLS[P.id]+'"></i>'+(allied(ME,P.id)?'🤝 ':'')+P.name+' '+(100*P.tiles/g.M.total).toFixed(P.tiles*50<g.M.total?1:0)+'%</span>').join('')+
    '<span class="chip">'+(g.mp && g.tick<SPAWN_T ? '⏱ '+Math.ceil((SPAWN_T-g.tick)/10) : rank.length+' left')+'</span>';
  $('fill').style.width=Math.min(100,100*me.troops/cap)+'%';
  $('tr').textContent=wait?'':fmt(me.troops)+' / '+fmt(cap);
  $('gd').innerHTML=wait?'':'● '+fmt(me.gold)+'<i>+'+fmt((GOLD+GOLD_LAND*me.tiles/g.M.total)*10)+'/s</i>';
  const cc=cityCost(me), fc=fortCost(me);

  $('bCity').disabled=me.gold<cc; $('bFort').disabled=me.gold<fc;
  const wp=ARMS[armed>=3?armed-3:0]; $('aNuke').firstElementChild.textContent=wp.ico;
  for (const b of $('arms').children) b.disabled=me.gold<ARMS[b.dataset.w].cost;
  for (const [id,cost,t] of [['aCity',cc,1],['aFort',fc,2],['aNuke',wp.cost,armed>=3?armed:3]]){
    const b=$(id), k=Math.min(1,me.gold/cost); b.lastElementChild.textContent=fmt(cost);
    b.classList.toggle('ready',k>=1); b.classList.toggle('on',armed===t);
    b.style.background=armed===t?'#ffd23f':'linear-gradient(90deg,#4b5a3a '+(k*100)+'%,#2a313b '+(k*100)+'%)';
  }
  $('bar').style.display=wait?'none':''; $('speed').style.display=g.mp?'none':'';
  const out=g.attacks.filter(a=>a.from===ME && !a.dead).map(a=>'<button data-a="'+a.id+'">→ '+(g.players[a.to].name||'land')+' '+fmt(a.troops)+' ✕</button>');
  const sea=boatsOf(ME); if (sea) out.push('⛵ '+sea);
  const inc=g.attacks.filter(a=>a.to===ME).map(a=>'<b>← '+g.players[a.from].name+' '+fmt(a.troops)+'</b>');
  $('atk').innerHTML=inc.concat(out).join(' ');

}
let toastT=0;
function toast(s){ if (G && G.silent) return; const t=$('toast'); t.textContent=s; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2200); }

/* ---------- loop ---------- */
let last=0, acc=0, hudAt=0;
// what a network match costs on this device, reported to server.py every ten seconds (it keeps them in perf.log)
const PF={at:0,n:0,slow:0,worst:0,sim:0,drw:0,tiles:0,gap:0,late:0,q:0,lat:[],heard:0};
function report(ts){
  const l=PF.lat.sort((a,b)=>a-b), r=x=>Math.round(x*10)/10;
  if (PF.at && PF.n) fetch('mp/perf',{method:'POST',body:JSON.stringify({id:NET.id,p:{frames:PF.n,over50ms:PF.slow,worstFrame:r(PF.worst),simMax:r(PF.sim),drawMax:r(PF.drw),tilesMax:PF.tiles,
    turnGapMax:r(PF.gap),turnsLate:PF.late,queueMax:PF.q,taps:l.length,tapMedian:r(l[l.length>>1]||0),tapMax:r(l[l.length-1]||0),
    tick:G.tick,map:G.M.id,canvas:cv.width+'x'+cv.height,ua:navigator.userAgent.slice(0,150)}})}).catch(()=>{});
  PF.at=ts; PF.n=PF.slow=PF.worst=PF.sim=PF.drw=PF.tiles=PF.gap=PF.late=PF.q=0; PF.lat=[];
}
function frame(ts){
  const raw=ts-last, dt=Math.min(100,raw); last=ts;
  if (G){
    const live=G.mp && NET && NET.ready && G.phase==='play', t0=live?performance.now():0;
    if (G.mp){ if (NET && NET.ready) pump(dt); }
    else if (G.phase==='play' && !paused){
      let f=dt*speed/100;
      while (f>0 && G.phase==='play'){ const s=Math.min(f,1-acc); advance(s); acc+=s; f-=s; if (acc>=1-1e-9){ acc=0; tick(); } }
    }
    const t1=live?performance.now():0;
    draw(); if (ts-hudAt>120){ hudAt=ts; hud(); }
    if (live){
      const t2=performance.now(); PF.n++; if (raw>50) PF.slow++; if (raw<5000) PF.worst=Math.max(PF.worst,raw);
      PF.sim=Math.max(PF.sim,t1-t0); PF.drw=Math.max(PF.drw,t2-t1); PF.q=Math.max(PF.q,NET.q.length);
      if (ts-PF.at>10000) report(ts);
    }
  }
  requestAnimationFrame(frame);
}

  if (pts.size===1){ moved=false; sx=e.clientX; sy=e.clientY; const x=sx, y=sy; pressT=setTimeout(()=>{ if (pts.size===1 && !moved){ swallow=true; longPress(x,y); } },450); } else moved=true;
});

  const p=pts.get(e.pointerId); if (!p || !G) return;
  if (pts.size===1){

    if (moved){ V.x+=e.clientX-p.x; V.y+=e.clientY-p.y; }

});

  if (tap && G && !swallow){ tapX=e.clientX; tapY=e.clientY; G.fx.push({x:(tapX-V.x)/V.s,y:(tapY-V.y)/V.s,t:performance.now()}); tapAt(e.clientX,e.clientY); }

function cellAt(x,y){

const myName = () => clean(save.name);
// a bar button arms a building (1 city, 2 post) or a weapon (3 missile, 4 nuke); the next tap places it on your own
// land, or fires at another nation's
const priceOf = (t,P) => t===1 ? cityCost(P) : t===2 ? fortCost(P) : ARMS[t-3].cost;
function arm(t){ const me=G.players[ME]; armed=(!t || armed===t || me.gold<priceOf(t,me))?0:t; hud(); }
// tapping your own land offers what can be built there
function openPop(c){ if (G.bld[c]) return; popCell=c; const e=$('pop'); e.style.left=within(tapX,90,cw-90)+'px'; e.style.top=Math.max(110,tapY)+'px'; e.classList.remove('hidden'); hud(); }
function closePop(){ popCell=-1; natCell=-1; natWho=0; $('pop').classList.add('hidden'); $('nat').classList.add('hidden'); $('arms').classList.add('hidden'); }
// long-press (or right-click, or a tap on an ally): the nation's card
function openNat(c){
  const o=G.owner[c]; if (o<1 || o===ME) return; const Q=G.players[o];
  natCell=c; popCell=c; natWho=o; const e=$('nat'); e.style.left=within(tapX,90,cw-90)+'px'; e.style.top=Math.max(130,tapY)+'px';
  natState(); e.classList.remove('hidden');
}
// the card belongs to the nation it was opened on, wherever the borders have moved since
function natState(){
  const o=natWho, Q=G.players[o]; if (!Q.alive){ closePop(); return; }
  $('natH').innerHTML='<i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:'+COLS[o]+'"></i> <b>'+Q.name+'</b><br>'+fmt(Q.troops)+' · ● '+fmt(Q.gold)+(Q.traitor>G.tick?' · 💔':'');
  const al=allied(ME,o), asked=G.players[ME].asks.some(a=>a.from===o);
  $('nAlly').textContent=al?'💔':'🤝'; $('nAlly').disabled=!al && !asked && G.cool[ME*G.n1+o]>G.tick; $('nBoat').disabled=al;
}
// a cell of nation o at or near c
function cellOf(o,c){
  const {M,owner}=G; if (owner[c]===o) return c;
  const x=c%M.W, y=(c/M.W)|0; let best=-1, bd=1e9;
  for (let dy=-40;dy<=40;dy++) for (let dx=-40;dx<=40;dx++){
    const X=x+dx, Y=y+dy; if (X<0||Y<0||X>=M.W||Y>=M.H) continue;
    const d=dx*dx+dy*dy; if (d<bd && owner[Y*M.W+X]===o){ bd=d; best=Y*M.W+X; }
  }
  return best;
}
function longPress(x,y){
  if (!G || G.phase!=='play' || !G.players[ME].alive) return; tapX=x; tapY=y;
  const c=cellAt(x,y); if (c<0) return;
  if (G.owner[c]===ME) openPop(c); else openNat(c);
}
// a name is needed before anything else; say so where the player is looking
function needName(){
  if (myName()) return false;
  $('nm').classList.add('need'); $('nm').scrollIntoView({block:'center'}); $('nm').focus(); toast('Enter your name first');
  return true;
}
async function start(mi){                     // a game on this device alone
  if (needName()) return;
  ME=1;
  let M; try { M=await loadMap(mi); } catch(e){ toast('Map did not load'); return; }
  newGame(M,save.diff,null,null,[myName()]); fit(); paused=true; acc=0; armed=0; closePop();
  for (const id of ['menu','end','help']) $(id).classList.add('hidden');
  $('resume').style.display='';
}
// which menu this is: alone, choosing a lobby, or inside one
const menuMode = () => !NET || NET.solo ? 'solo' : NET.room ? 'room' : 'entry';
function buildMenu(){
  $('maps').innerHTML=MAPS.map((m,i)=>'<button data-m="'+i+'" style="background-image:url(maps/'+m[0]+'/thumbnail.webp)"><span>'+m[1]+(save.wins[m[0]+'/'+save.diff]?' ★':'')+'</span></button>').join('');
  if (document.activeElement!==$('nm')) $('nm').value=save.name||'';
  renderMenu();
}
function renderMenu(){
  const mode=menuMode(), r=NET && NET.room, host=!!r && r.host===NET.id, show=(id,on)=>$(id).classList.toggle('hidden',!on);
  show('entry',mode==='entry'); show('room',mode==='room'); show('pick',mode!=='entry');
  show('go',mode==='room' && host); show('leave',mode==='room'); show('toMp',!!NET && NET.solo); show('join',!NET);
  show('lan',!!NET && mode!=='solo' && !!NET.lan);
  $('pick').classList.toggle('ro',mode==='room' && !host);
  const cfg=mode==='room' ? r.cfg : {map:-1,diff:save.diff,bots:save.bots};
  for (const b of $('maps').children) b.classList.toggle('sel',+b.dataset.m===cfg.map);
  for (const b of $('diff').children) b.classList.toggle('on',b.dataset.d===cfg.diff);
  for (const b of $('nb').children) b.classList.toggle('on',+b.dataset.n===cfg.bots);
  $('nm').classList.toggle('need',!myName());
  if (NET) $('lan').innerHTML='Others join at <b>http://'+NET.lan+'</b>';
  if (mode==='entry')
    $('rooms').innerHTML=NET.rooms.map(q=>'<button data-r="'+q.code+'"><b>'+(clean(q.host)||'?')+'</b>’s lobby · '+q.n+(q.n===1?' player':' players')+(q.running?' · playing':'')+'</button>').join('');
  if (mode==='room'){
    const hostP=r.players.find(q=>q.id===r.host), hn=clean(hostP && hostP.name)||'?';
    $('roomT').textContent=hn+'’s lobby · '+r.code;
    $('who').innerHTML=r.players.map((q,i)=>'<span class="chip'+(q.on?'':' off')+'"><i style="background:'+COLS[i+1]+'"></i>'+(clean(q.name)||'…')+(q.id===r.host?' ★':'')+'</span>').join('');
    $('roomS').textContent=r.running && !r.playing ? 'A match is running. You are in the next one.'
      : host ? (r.running ? 'Match running.' : 'Pick a map, then press Start.')
      : r.running ? 'Match running.' : 'Waiting for '+hn+' to start.';
    $('go').textContent=r.running ? 'Start a new match' : 'Start';
    $('link').value='http://'+NET.lan+'/?room='+r.code;
  }
}

/* ---------- network play ----------
   When the page is served by server.py (on a laptop, say) instead of a static host, everyone who opens it
   lands in one lobby. The server sends each device the same actions for the same tick, ten ticks a second;
   every device runs the whole game from the same seed, so nothing but actions travels. */
// one server turn: its actions, then the tick in NET_SUB equal slices (the same slices on every device)
function slice(){
  const n=NET;
  if (!n.cur){
    if (!n.q.length) return false;
    n.cur=n.q.shift(); n.sub=0;
    for (const [p,it] of n.cur.in){ if (p===ME && it.z && n.q.length<3){ const d=performance.now()-it.z; if (d>=0 && d<5000) PF.lat.push(d); } apply(p,it); }
  }
  advance(1/NET_SUB);
  if (++n.sub===NET_SUB){
    tick(); n.cur=null;
    if (G.tick%100===0){ let h=G.tick; for (const P of G.players) h=(Math.imul(h,31)+P.tiles*7+Math.floor(P.troops))|0; n.sums[G.tick]=h; n.post('mp/act',{id:n.id,it:{k:'hash',n:G.tick,h}}); }
  }
  return true;
}
function pump(dt){
  const n=NET;
  if (n.q.length>30){                         // far behind (just rejoined): replay as fast as the device allows
    const t0=performance.now();
    while (n.q.length>3 && G.phase==='play' && performance.now()-t0<14) slice();
    n.acc=0; return;
  }
  if (!n.cur && n.q.length && n.acc<100/NET_SUB) n.acc=100/NET_SUB;       // idle and a turn is here: begin now
  n.acc+=dt*(n.q.length>3?4:n.q.length>0?1.7:1.3);
  let guard=0;
  while (n.acc>=100/NET_SUB && guard++<400 && G.phase==='play'){
    n.acc-=100/NET_SUB;
    if (!slice()){ n.acc=0; break; }
  }
}
async function netStart(m){
  const run=++NET.run;                                             // a newer start (or a rejoin) overrides this one
  let M; try { M=await loadMap(m.map); } catch(e){ toast('Map did not load'); return; }
  if (run!==NET.run) return;
  const seat=m.players.findIndex(q=>q.id===NET.id)+1;
  if (seat<1) return;
  ME=seat;
  newGame(M,m.diff,m.seed,m.bots,m.players.map((q,i)=>clean(q.name)||'Player '+(i+1)));
  G.mp=true; G.phase='play'; fit(); acc=0; armed=0; closePop();
  for (const id of ['menu','end','help']) $(id).classList.add('hidden');
  $('resume').style.display=''; NET.cur=null; NET.acc=0; NET.sums={}; NET.ready=true;
}
// out of a network match (it was stopped, or I left the lobby): freeze it and show the menu
function netDrop(){
  NET.run++; NET.ready=false; NET.q=[]; NET.cur=null;
  if (G && G.mp){ G.phase='over'; $('end').classList.add('hidden'); $('resume').style.display='none'; buildMenu(); $('menu').classList.remove('hidden'); }
}
// the line to the server; reopened whenever it goes quiet, and the server then sends whatever was missed
function netOpen(){
  const n=NET; if (n.es) n.es.close();
  n.heard=n.opened=performance.now();
  const es=n.es=new EventSource('mp/events?key='+n.key+'&name='+encodeURIComponent(myName()));
  es.onmessage=e=>{
    if (es!==n.es) return;
    n.heard=performance.now();
    const m=JSON.parse(e.data);
    if (m.t==='hello'){
      n.id=m.id; n.lan=m.lan;
      if (myName()) n.post('mp/name',{id:n.id,name:myName()});
      if (n.want && myName()){ n.post('mp/join',{id:n.id,room:n.want}); n.want=''; }      // arrived by a lobby link
    }
    else if (m.t==='state'){ n.rooms=m.rooms; n.room=m.room; renderMenu(); }
    else if (m.t==='start'){ n.q=[]; n.cur=null; n.ready=false; netStart(m); }
    else if (m.t==='catchup'){ n.q=[]; n.cur=null; for (let i=1;i<=m.n;i++) n.q.push({n:i,in:m.acts[i]||[]}); }
    else if (m.t==='turn'){ n.q.push(m); const d=PF.heard?n.heard-PF.heard:0; PF.heard=n.heard; if (d<5000){ PF.gap=Math.max(PF.gap,d); if (d>180) PF.late++; } }
    else if (m.t==='stop') netDrop();
    else if (m.t==='desync') toast('Devices out of step');
  };
}
async function netInit(){
  for (let tries=0;;tries++){
    try {
      const r=await fetch('mp/ping',{cache:'no-store'}); if (!r.ok) return;
      const j=await r.json(); if (!j.landmark) return;
      if (j.v!==3){ $('lan').classList.remove('hidden'); $('lan').innerHTML='<b>The server on the laptop is an older copy. Close it and run server.py again.</b>'; return; }
      break;
    }
    catch(e){ if (location.protocol==='https:' || tries>20) return; await new Promise(r=>setTimeout(r,1500)); }
  }
  let key=''; try { key=sessionStorage.getItem('landmark.key')||''; } catch(e){}
  if (!key){ key=Math.random().toString(36).slice(2)+Date.now().toString(36); try { sessionStorage.setItem('landmark.key',key); } catch(e){} }
  NET={es:null,key,id:0,lan:'',rooms:[],room:null,solo:false,want:(new URLSearchParams(location.search).get('room')||'').toUpperCase(),
       q:[],cur:null,sub:0,acc:0,ready:false,sums:{},run:0,heard:0,
       // every request says so if it fails: a server that does not know this device, or an old server still running
       post(u,b){
         fetch(u,{method:'POST',body:JSON.stringify(b)}).then(r=>{
           if (r.ok) return;
           if (r.status===403){ if (performance.now()-NET.heard>1500 || performance.now()-NET.opened>4000){ toast('Reconnecting…'); netOpen(); } }
           else if (r.status===409) toast('That lobby is full or gone');
           else toast('The server did not accept that. Restart server.py on the laptop.');
         }).catch(()=>toast('No answer from the server'));
       },
       send(it){ this.post('mp/act',{id:this.id,it}); }};
  renderMenu(); netOpen();
  // the server speaks at least every 2 seconds; silence for 5 means the line is dead, so open a new one
  setInterval(()=>{ if (performance.now()-NET.heard>5000) netOpen(); },1000);
  document.addEventListener('visibilitychange',()=>{ if (!document.hidden && performance.now()-NET.heard>2500) netOpen(); });
}
buildMenu(); fit(); requestAnimationFrame(frame); netInit();
{ const j=new URLSearchParams(location.search).get('join'); if (j && location.protocol==='https:'){ $('addr').value=j; $('join').dispatchEvent(new Event('submit',{cancelable:true})); } }

/* ---------- test hooks ---------- */
window.lg={
  get G(){ return G; }, get V(){ return V; }, get ME(){ return ME; }, get NET(){ return NET; }, DIFF, GRACE, MAPS, FL, loadMap, pump, act, set(a,b,c){ LOSS=a; LOSSP=b; PACE=c; },
  tick(n){ while (n-->0 && G.phase==='play'){ advance(1); tick(); } },
  // bot-only match: seat 1 plays as the given flavour with a human's growth rate
  sim(mi,diff,seed,flavour,maxTicks){
    const M=built[mi]; newGame(M,diff,seed,this.bots||9); G.silent=true;
    const cand=[]; for (let c=0;c<M.N;c+=3) if (M.land[c] && G.owner[c]===0 && M.size[M.comp[c]]>=60) cand.push(c);
    ME=1; spawn(1,cand[(G.rnd()*cand.length)|0]); const me=G.players[1]; me.fl=FL[flavour]; me.next=10; me.warn=0; G.phase='play';
    while (G.phase==='play' && G.tick<(maxTicks||12000)){ advance(1); tick(); }
    return {won:!!G.won, over:G.phase==='over', secs:G.tick/10, left:G.players.filter(P=>P.alive).length,
            share:G.players.slice(1).filter(P=>P.alive).map(P=>P.name+':'+Math.round(100*P.tiles/M.total))};
  },
};
